name: engine

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    # Backstop for the local pre-commit/pre-push hooks: every tracked file and every
    # commit ever made. Findings are printed mostly hidden, because this log is public.
    name: secret check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 scripts/check_secrets.py --all
      - run: python3 scripts/check_secrets.py --history

  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel matches the iMac (x86_64). GitHub keeps it until August 2027,
        # its last Intel image. macos-latest is Apple Silicon.
        os: [macos-15-intel, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Missing ffmpeg, ffprobe, fpcalc or deno fails the run instead of skipping tests.
      MUSICORG_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ffmpeg chromaprint deno

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install deno (Windows)
        if: runner.os == 'Windows'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install fpcalc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "1.6.1"
          $name = "chromaprint-fpcalc-$version-windows-x86_64"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/acoustid/chromaprint/releases/download/v$version/$name.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "fpcalc")
          $exe = Get-ChildItem (Join-Path $env:RUNNER_TEMP "fpcalc") -Recurse -Filter fpcalc.exe | Select-Object -First 1
          if (-not $exe) { throw "fpcalc.exe not found in $name.zip" }
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install the engine
        run: |
          python -m pip install --upgrade pip
          pip install -e "engine[dev]"

      - name: ruff check
        run: ruff check engine scripts

      - name: musicorg doctor
        run: musicorg doctor

      - name: pytest
        run: pytest engine

  app:
    # The Mac app (v0.2): build it and run the tests of everything that needs no window.
    name: mac app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: swift build
        run: swift build --package-path app
      - name: swift test
        run: swift test --package-path app
